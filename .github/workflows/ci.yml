name: Backend CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Typecheck TypeScript (Strict)
        run: bunx tsc --noEmit

      - name: Run Unit & Security Tests
        env:
          DATABASE_URL: "postgresql://neondb_owner:npg_59dmJucPUeHp@ep-lucky-queen-a1ok349a.ap-southeast-1.aws.neon.tech/kumpulmaindb?sslmode=require&schema=nodewave"
          JWT_SECRET: "nodewave-super-secret-jwt-key-2026-production-ready"
        run: bun test
